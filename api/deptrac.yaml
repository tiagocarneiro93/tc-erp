deptrac:
    paths:
        - ./src
    exclude_files:
        - '#.*Tests?\.php#'
    layers:
        # One layer per (module, tier) pair (CLAUDE.md — architecture rules).
        # This is Deptrac's standard pattern for modular monoliths: it can't
        # parametrise layers by a regex capture group, so a brand new module
        # needs its own four layers + ruleset entry added here, copying the
        # Platform block below. See docs/decisions/0001-modular-monolith-hexagonal.md.
        - name: Shared.Domain
          collectors:
              - type: classNameRegex
                value: '#^App\\Shared\\Domain\\.*#'
        - name: Shared.Application
          collectors:
              - type: classNameRegex
                value: '#^App\\Shared\\Application\\.*#'
        - name: Shared.Infrastructure
          collectors:
              - type: classNameRegex
                value: '#^App\\Shared\\Infrastructure\\.*#'
        - name: Shared.UIHttp
          collectors:
              - type: classNameRegex
                value: '#^App\\Shared\\UI\\Http\\.*#'

        - name: Platform.Domain
          collectors:
              - type: classNameRegex
                value: '#^App\\Platform\\Domain\\.*#'
        - name: Platform.Application
          collectors:
              - type: classNameRegex
                value: '#^App\\Platform\\Application\\.*#'
        - name: Platform.Infrastructure
          collectors:
              - type: classNameRegex
                value: '#^App\\Platform\\Infrastructure\\.*#'
        - name: Platform.UIHttp
          collectors:
              - type: classNameRegex
                value: '#^App\\Platform\\UI\\Http\\.*#'

        - name: Catalog.Domain
          collectors:
              - type: classNameRegex
                value: '#^App\\Catalog\\Domain\\.*#'
        - name: Catalog.Application
          collectors:
              - type: classNameRegex
                value: '#^App\\Catalog\\Application\\.*#'
        - name: Catalog.Infrastructure
          collectors:
              - type: classNameRegex
                value: '#^App\\Catalog\\Infrastructure\\.*#'
        - name: Catalog.UIHttp
          collectors:
              - type: classNameRegex
                value: '#^App\\Catalog\\UI\\Http\\.*#'

        - name: Tax.Domain
          collectors:
              - type: classNameRegex
                value: '#^App\\Tax\\Domain\\.*#'
        - name: Tax.Application
          collectors:
              - type: classNameRegex
                value: '#^App\\Tax\\Application\\.*#'
        - name: Tax.Infrastructure
          collectors:
              - type: classNameRegex
                value: '#^App\\Tax\\Infrastructure\\.*#'
        - name: Tax.UIHttp
          collectors:
              - type: classNameRegex
                value: '#^App\\Tax\\UI\\Http\\.*#'

        - name: Fiscal.Domain
          collectors:
              - type: classNameRegex
                value: '#^App\\Fiscal\\Domain\\.*#'
        - name: Fiscal.Application
          collectors:
              - type: classNameRegex
                value: '#^App\\Fiscal\\Application\\.*#'
        - name: Fiscal.Infrastructure
          collectors:
              - type: classNameRegex
                value: '#^App\\Fiscal\\Infrastructure\\.*#'
        - name: Fiscal.UIHttp
          collectors:
              - type: classNameRegex
                value: '#^App\\Fiscal\\UI\\Http\\.*#'

        - name: Company.Domain
          collectors:
              - type: classNameRegex
                value: '#^App\\Company\\Domain\\.*#'
        - name: Company.Application
          collectors:
              - type: classNameRegex
                value: '#^App\\Company\\Application\\.*#'
        - name: Company.Infrastructure
          collectors:
              - type: classNameRegex
                value: '#^App\\Company\\Infrastructure\\.*#'
        - name: Company.UIHttp
          collectors:
              - type: classNameRegex
                value: '#^App\\Company\\UI\\Http\\.*#'
    ruleset:
        # Domain: nothing but itself and Shared.Domain (CLAUDE.md: "Domain
        # depends on nothing outside Domain and Shared/Domain").
        Platform.Domain:
            - Platform.Domain
            - Shared.Domain

        # Application: its own Domain, plus any module's Application layer
        # (CLAUDE.md: "Modules communicate through application services or
        # domain events, never through another module's repositories").
        Platform.Application:
            - Platform.Application
            - Platform.Domain
            - Shared.Domain

        # Infrastructure and UI: depend on Application and Domain of their
        # own module only, never another module's Infrastructure directly.
        Platform.Infrastructure:
            - Platform.Infrastructure
            - Platform.Application
            - Platform.Domain
            - Shared.Domain
            - Shared.Infrastructure
        Platform.UIHttp:
            - Platform.UIHttp
            - Platform.Application
            - Platform.Domain
            - Shared.Domain

        Catalog.Domain:
            - Catalog.Domain
            - Shared.Domain
        Catalog.Application:
            - Catalog.Application
            - Catalog.Domain
            - Shared.Domain
        Catalog.Infrastructure:
            - Catalog.Infrastructure
            - Catalog.Application
            - Catalog.Domain
            - Shared.Domain
            - Shared.Infrastructure
        Catalog.UIHttp:
            - Catalog.UIHttp
            - Catalog.Application
            - Catalog.Domain
            - Shared.Domain

        Tax.Domain:
            - Tax.Domain
            - Shared.Domain
        Tax.Application:
            - Tax.Application
            - Tax.Domain
            - Shared.Domain
        Tax.Infrastructure:
            - Tax.Infrastructure
            - Tax.Application
            - Tax.Domain
            - Shared.Domain
            - Shared.Infrastructure
        Tax.UIHttp:
            - Tax.UIHttp
            - Tax.Application
            - Tax.Domain
            - Shared.Domain

        Fiscal.Domain:
            - Fiscal.Domain
            - Shared.Domain
        Fiscal.Application:
            - Fiscal.Application
            - Fiscal.Domain
            - Shared.Domain
        Fiscal.Infrastructure:
            - Fiscal.Infrastructure
            - Fiscal.Application
            - Fiscal.Domain
            - Shared.Domain
            - Shared.Infrastructure
        Fiscal.UIHttp:
            - Fiscal.UIHttp
            - Fiscal.Application
            - Fiscal.Domain
            - Shared.Domain

        Company.Domain:
            - Company.Domain
            - Shared.Domain
        Company.Application:
            - Company.Application
            - Company.Domain
            - Shared.Domain
        Company.Infrastructure:
            - Company.Infrastructure
            - Company.Application
            - Company.Domain
            - Shared.Domain
            - Shared.Infrastructure
        Company.UIHttp:
            - Company.UIHttp
            - Company.Application
            - Company.Domain
            - Shared.Domain

        Shared.Domain:
            - Shared.Domain
        Shared.Application:
            - Shared.Application
            - Shared.Domain
        Shared.Infrastructure:
            - Shared.Infrastructure
            - Shared.Domain
        Shared.UIHttp:
            - Shared.UIHttp
            - Shared.Application
            - Shared.Domain
