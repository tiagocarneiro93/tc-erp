# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.mailer_from_address: '%env(MAILER_FROM_ADDRESS)%'
    app.frontend_url: '%env(FRONTEND_URL)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # Domain/Application code depends on the Clock port, never `new
    # DateTimeImmutable()` directly (CLAUDE.md — architecture rules).
    App\Shared\Domain\Clock\Clock: '@App\Shared\Infrastructure\Clock\SystemClock'

    # Repository ports (Domain) -> Doctrine adapters (Infrastructure). Public
    # so integration tests can fetch them directly before anything in the
    # app itself consumes them (tasks 0.8/0.10 will); otherwise Symfony's
    # container compiler removes an alias nothing references as dead code.
    App\Platform\Domain\UserRepository:
        alias: App\Platform\Infrastructure\Persistence\Doctrine\Repository\DoctrineUserRepository
        public: true
    App\Platform\Domain\CompanyRepository:
        alias: App\Platform\Infrastructure\Persistence\Doctrine\Repository\DoctrineCompanyRepository
        public: true
    App\Platform\Domain\MembershipRepository:
        alias: App\Platform\Infrastructure\Persistence\Doctrine\Repository\DoctrineMembershipRepository
        public: true
    App\Platform\Domain\RoleRepository:
        alias: App\Platform\Infrastructure\Persistence\Doctrine\Repository\DoctrineRoleRepository
        public: true
    App\Platform\Domain\PasswordResetTokenRepository:
        alias: App\Platform\Infrastructure\Persistence\Doctrine\Repository\DoctrinePasswordResetTokenRepository
        public: true
    App\Platform\Domain\PasswordHasher: '@App\Platform\Infrastructure\Security\SymfonyPasswordHasher'
    App\Platform\Domain\PasswordResetMailer: '@App\Platform\Infrastructure\Mail\SymfonyPasswordResetMailer'
    App\Platform\Domain\InvitationMailer: '@App\Platform\Infrastructure\Mail\SymfonyInvitationMailer'

    # Same alias-must-be-public pattern as the repositories above, so
    # UI/Http controllers can depend on the Application-layer port instead
    # of the Infrastructure Security adapter (Deptrac — architecture rules).
    App\Platform\Application\Security\CurrentUserId:
        alias: App\Platform\Infrastructure\Security\SymfonyCurrentUserId
        public: true
    App\Platform\Application\Security\PermissionChecker: '@App\Platform\Infrastructure\Security\SymfonyPermissionChecker'

    # Cross-module twins of the two aliases above (docs/decisions/0004): the
    # same concrete adapters, exposed under the Shared.Domain port every
    # other module depends on instead.
    App\Shared\Domain\Security\PermissionChecker:
        alias: App\Platform\Infrastructure\Security\SymfonyPermissionChecker
        public: true
    App\Shared\Domain\Security\CurrentActorId:
        alias: App\Platform\Infrastructure\Security\SymfonyCurrentActorId
        public: true

    App\Platform\Infrastructure\Mail\SymfonyPasswordResetMailer:
        arguments:
            $fromAddress: '%app.mailer_from_address%'
    App\Platform\Infrastructure\Mail\SymfonyInvitationMailer:
        arguments:
            $fromAddress: '%app.mailer_from_address%'

    App\Platform\Application\Command\RequestPasswordResetHandler:
        arguments:
            $frontendUrl: '%app.frontend_url%'
    App\Platform\Application\Command\InviteUserToCompanyHandler:
        arguments:
            $frontendUrl: '%app.frontend_url%'

    # Company context (technical-scope.md §5.2/§5.3, CLAUDE.md task 0.9).
    # CompanyContext is aliased non-public: DoctrineAuditLogger and the DBAL
    # middleware already depend on it, so it is never dead code. The route
    # listener and Messenger middleware need to *mutate* the context, so
    # they depend on the concrete RequestCompanyContext directly.
    # RequestCompanyContext implements ResetInterface, so autoconfigure
    # already tags it kernel.reset; no manual tag needed (and a manual one
    # would need an explicit reset method attribute).
    App\Shared\Domain\Company\CompanyContext: '@App\Shared\Infrastructure\Company\RequestCompanyContext'

    # Nothing consumes these yet (Phase 1 query handlers and AuditLogger
    # callers will) — public so they are not compiled away as dead code,
    # same reasoning as the repository aliases above.
    App\Shared\Domain\Company\CompanyQueryRunner:
        alias: App\Shared\Infrastructure\Persistence\Doctrine\DbalCompanyQueryRunner
        public: true
    App\Shared\Domain\Audit\AuditLogger:
        alias: App\Shared\Infrastructure\Audit\DoctrineAuditLogger
        public: true
    App\Shared\Domain\Idempotency\IdempotencyKeyStore:
        alias: App\Shared\Infrastructure\Persistence\Doctrine\DoctrineIdempotencyKeyStore
        public: true
    # Was aliased under a stale `Shared\Domain\Reference\` namespace (never
    # matching the actual interface, `Shared\Domain\CountryRepository` — the
    # flat convention task 1.1 settled on) until task 1.4 became its first
    # real consumer and needed the alias to resolve.
    App\Shared\Domain\CountryRepository:
        alias: App\Shared\Infrastructure\Persistence\Doctrine\Repository\DoctrineCountryRepository
        public: true
    App\Catalog\Domain\UnitRepository:
        alias: App\Catalog\Infrastructure\Persistence\Doctrine\Repository\DoctrineUnitRepository
        public: true
    App\Tax\Domain\TaxRateRepository:
        alias: App\Tax\Infrastructure\Persistence\Doctrine\Repository\DoctrineTaxRateRepository
        public: true
    App\Tax\Domain\ExemptionReasonRepository:
        alias: App\Tax\Infrastructure\Persistence\Doctrine\Repository\DoctrineExemptionReasonRepository
        public: true
    App\Fiscal\Domain\DocumentTypeRepository:
        alias: App\Fiscal\Infrastructure\Persistence\Doctrine\Repository\DoctrineDocumentTypeRepository
        public: true
    App\Company\Domain\CompanyProfileRepository:
        alias: App\Company\Infrastructure\Persistence\Doctrine\Repository\DoctrineCompanyProfileRepository
        public: true
    App\Company\Domain\CompanySettingRepository:
        alias: App\Company\Infrastructure\Persistence\Doctrine\Repository\DoctrineCompanySettingRepository
        public: true
    App\Company\Domain\AtCredentialsRepository:
        alias: App\Company\Infrastructure\Persistence\Doctrine\Repository\DoctrineAtCredentialsRepository
        public: true
    App\Company\Domain\AtCredentialsEncryptor: '@App\Company\Infrastructure\Security\SodiumAtCredentialsEncryptor'
    App\Company\Infrastructure\Security\SodiumAtCredentialsEncryptor:
        arguments:
            $base64Key: '%env(AT_CREDENTIALS_ENCRYPTION_KEY)%'
    App\Parties\Domain\CustomerRepository:
        alias: App\Parties\Infrastructure\Persistence\Doctrine\Repository\DoctrineCustomerRepository
        public: true
    App\Parties\Domain\SupplierRepository:
        alias: App\Parties\Infrastructure\Persistence\Doctrine\Repository\DoctrineSupplierRepository
        public: true
    App\Parties\Domain\AddressRepository:
        alias: App\Parties\Infrastructure\Persistence\Doctrine\Repository\DoctrineAddressRepository
        public: true
    App\Shared\Domain\Tax\TaxRateExistenceChecker:
        alias: App\Tax\Infrastructure\Persistence\Doctrine\Repository\DoctrineTaxRateRepository
        public: true
    App\Shared\Domain\Tax\TaxRateConverter:
        alias: App\Tax\Infrastructure\Persistence\Doctrine\Repository\DoctrineTaxRateRepository
        public: true
    App\Shared\Domain\Tax\ExemptionReasonExistenceChecker:
        alias: App\Tax\Infrastructure\Persistence\Doctrine\Repository\DoctrineExemptionReasonRepository
        public: true
    App\Catalog\Domain\ProductFamilyRepository:
        alias: App\Catalog\Infrastructure\Persistence\Doctrine\Repository\DoctrineProductFamilyRepository
        public: true
    App\Catalog\Domain\ProductRepository:
        alias: App\Catalog\Infrastructure\Persistence\Doctrine\Repository\DoctrineProductRepository
        public: true
    App\Catalog\Domain\PriceListRepository:
        alias: App\Catalog\Infrastructure\Persistence\Doctrine\Repository\DoctrinePriceListRepository
        public: true
    App\Catalog\Domain\ProductPriceRepository:
        alias: App\Catalog\Infrastructure\Persistence\Doctrine\Repository\DoctrineProductPriceRepository
        public: true
    App\Catalog\Domain\ProductComponentRepository:
        alias: App\Catalog\Infrastructure\Persistence\Doctrine\Repository\DoctrineProductComponentRepository
        public: true
    # Nothing calls this yet either — no issuing endpoint exists before
    # Phase 2 — so it needs the same public: true treatment.
    App\Shared\Infrastructure\Http\IdempotencyKeyGuard:
        public: true

    # Scoped to the `default` connection only — `migrations` runs DDL as
    # app_owner and never needs a company context (config/packages/doctrine.yaml).
    # autoconfigure is disabled here because the generic `MiddlewareInterface`
    # autoconfiguration (doctrine-bundle) would otherwise *also* tag this
    # unscoped, applying it to every connection instead of just `default`.
    App\Shared\Infrastructure\Persistence\Doctrine\CompanyContextMiddleware:
        autowire: true
        autoconfigure: false
        tags:
            - { name: 'doctrine.middleware', connection: default }
