framework:
    messenger:
        default_bus: command.bus
        buses:
            # RestoreCompanyContextMiddleware runs before doctrine_transaction
            # so the company (from a CompanyStamp — technical-scope.md §5.4)
            # is already set by the time the transaction begins and the DBAL
            # middleware (config/services.yaml) needs to read it.
            command.bus:
                middleware:
                    - App\Shared\Infrastructure\Messenger\RestoreCompanyContextMiddleware
                    - doctrine_transaction
            # doctrine_transaction here too (task 1.4): a bare EntityManager
            # read outside any transaction never calls
            # CompanyContextConnection::beginTransaction(), so
            # `set_config('app.company_id', ...)` never runs and RLS-protected
            # reads fail with "unrecognized configuration parameter" — a gap
            # that only surfaced once a query handler first read a real
            # RLS-protected table (`company_profile`; every earlier query
            # touched only global tables or the RLS-exempt
            # `memberships`/`api_tokens`, see CompanyIsolationSchemaTest).
            # A read-only transaction is still a transaction; this changes
            # nothing for a query that never needed one.
            query.bus:
                middleware:
                    - App\Shared\Infrastructure\Messenger\RestoreCompanyContextMiddleware
                    - doctrine_transaction
            event.bus:
                default_middleware:
                    allow_no_handlers: true
                middleware:
                    - App\Shared\Infrastructure\Messenger\RestoreCompanyContextMiddleware
            # AT outbox consumer and sweeper (docs/plans/phase-3.md task 3.2).
            # Deliberately *no* doctrine_transaction: the handler talks to AT
            # between two short transactions it opens itself, and an open
            # transaction around a network call would hold a connection (and
            # row locks) for as long as AT takes to answer.
            at.bus:
                middleware:
                    - App\Shared\Infrastructure\Messenger\RestoreCompanyContextMiddleware
            # Sealing and e-mailing of documents (task 3.7): same reasoning as
            # at.bus — the handler seals in a short transaction of its own and
            # mails outside any transaction.
            output.bus:
                middleware:
                    - App\Shared\Infrastructure\Messenger\RestoreCompanyContextMiddleware

        # AT communication outbox (docs/plans/phase-3.md task 3.2).
        transports:
            async: '%env(MESSENGER_TRANSPORT_DSN)%'

        routing:
            App\AtIntegration\Application\Command\CommunicateToAt: async
            App\Output\Application\SendDocumentEmail: async

when@test:
    framework:
        messenger:
            transports:
                # Lets tests dispatch a message and consume it in-process,
                # with no real broker, to exercise RestoreCompanyContextMiddleware.
                async: 'in-memory://'

when@e2e:
    framework:
        messenger:
            transports:
                # No worker in the Playwright job: handle everything inside the request.
                async: 'sync://'
