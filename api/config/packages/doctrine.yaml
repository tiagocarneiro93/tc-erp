doctrine:
    dbal:
        # Custom types for value objects (CLAUDE.md — Domain has no Doctrine
        # dependency; the Type classes live in Infrastructure). Add one line
        # per new typed ID, following the same AbstractUuidIdType pattern.
        types:
            nif: App\Shared\Infrastructure\Persistence\Doctrine\Type\NifType
            jsonb: App\Shared\Infrastructure\Persistence\Doctrine\Type\JsonbType
            user_id: App\Platform\Infrastructure\Persistence\Doctrine\Type\UserIdType
            company_id: App\Shared\Infrastructure\Persistence\Doctrine\Type\CompanyIdType
            api_token_id: App\Platform\Infrastructure\Persistence\Doctrine\Type\ApiTokenIdType
            password_reset_token_id: App\Platform\Infrastructure\Persistence\Doctrine\Type\PasswordResetTokenIdType
            percentage: App\Shared\Infrastructure\Persistence\Doctrine\Type\PercentageType
            money: App\Shared\Infrastructure\Persistence\Doctrine\Type\MoneyType
            quantity: App\Shared\Infrastructure\Persistence\Doctrine\Type\QuantityType
            tax_rate_id: App\Tax\Infrastructure\Persistence\Doctrine\Type\TaxRateIdType
            customer_id: App\Parties\Infrastructure\Persistence\Doctrine\Type\CustomerIdType
            supplier_id: App\Parties\Infrastructure\Persistence\Doctrine\Type\SupplierIdType
            address_id: App\Parties\Infrastructure\Persistence\Doctrine\Type\AddressIdType
            product_family_id: App\Catalog\Infrastructure\Persistence\Doctrine\Type\ProductFamilyIdType
            product_id: App\Catalog\Infrastructure\Persistence\Doctrine\Type\ProductIdType
            price_list_id: App\Catalog\Infrastructure\Persistence\Doctrine\Type\PriceListIdType
            warehouse_id: App\Inventory\Infrastructure\Persistence\Doctrine\Type\WarehouseIdType
            payment_terms_id: App\Company\Infrastructure\Persistence\Doctrine\Type\PaymentTermsIdType
        default_connection: default
        connections:
            # The app connects as app_runtime: no table ownership, no BYPASSRLS,
            # so RLS policies always apply (CLAUDE.md — multi-tenancy).
            default:
                url: '%env(resolve:DATABASE_URL)%'
                profiling_collect_backtrace: '%kernel.debug%'
            # Migrations run as app_owner (config/packages/doctrine_migrations.yaml).
            migrations:
                url: '%env(resolve:DATABASE_MIGRATIONS_URL)%'
    orm:
        default_entity_manager: default
        entity_managers:
            # Used by the app at runtime, via the app_runtime connection.
            default: &entity_manager_defaults
                connection: default
                validate_xml_mapping: true
                naming_strategy: doctrine.orm.naming_strategy.underscore
                identity_generation_preferences:
                    Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
                auto_mapping: false
                mappings: &mappings
                    # One named mapping per module (CLAUDE.md — Domain has no
                    # Doctrine dependency; mapping lives in Infrastructure as
                    # XML). Add a new entry here, following the same pattern,
                    # whenever a module gets its first entity.
                    Platform:
                        type: xml
                        is_bundle: false
                        dir: '%kernel.project_dir%/src/Platform/Infrastructure/Persistence/Doctrine/Mapping'
                        prefix: 'App\Platform\Domain'
                        alias: Platform
                    Shared:
                        type: xml
                        is_bundle: false
                        dir: '%kernel.project_dir%/src/Shared/Infrastructure/Persistence/Doctrine/Mapping'
                        prefix: 'App\Shared\Domain'
                        alias: Shared
                    Catalog:
                        type: xml
                        is_bundle: false
                        dir: '%kernel.project_dir%/src/Catalog/Infrastructure/Persistence/Doctrine/Mapping'
                        prefix: 'App\Catalog\Domain'
                        alias: Catalog
                    Tax:
                        type: xml
                        is_bundle: false
                        dir: '%kernel.project_dir%/src/Tax/Infrastructure/Persistence/Doctrine/Mapping'
                        prefix: 'App\Tax\Domain'
                        alias: Tax
                    Fiscal:
                        type: xml
                        is_bundle: false
                        dir: '%kernel.project_dir%/src/Fiscal/Infrastructure/Persistence/Doctrine/Mapping'
                        prefix: 'App\Fiscal\Domain'
                        alias: Fiscal
                    Company:
                        type: xml
                        is_bundle: false
                        dir: '%kernel.project_dir%/src/Company/Infrastructure/Persistence/Doctrine/Mapping'
                        prefix: 'App\Company\Domain'
                        alias: Company
                    Parties:
                        type: xml
                        is_bundle: false
                        dir: '%kernel.project_dir%/src/Parties/Infrastructure/Persistence/Doctrine/Mapping'
                        prefix: 'App\Parties\Domain'
                        alias: Parties
                    Inventory:
                        type: xml
                        is_bundle: false
                        dir: '%kernel.project_dir%/src/Inventory/Infrastructure/Persistence/Doctrine/Mapping'
                        prefix: 'App\Inventory\Domain'
                        alias: Inventory
            # Same mappings, but via the app_owner connection — used only by
            # the migrations CLI (config/packages/doctrine_migrations.yaml),
            # never by the running application, so `doctrine:migrations:diff`
            # can compare entities against the schema while DDL still runs
            # as app_owner (CLAUDE.md — multi-tenancy).
            migrations:
                <<: *entity_manager_defaults
                connection: migrations
                mappings: *mappings

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
