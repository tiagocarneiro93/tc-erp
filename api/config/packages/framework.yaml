# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    # Cookie flags per CLAUDE.md task 0.8: httpOnly, Secure, SameSite=Lax.
    # cookie_secure: auto means "secure only when the request is HTTPS", so
    # local http:// dev still works; every real environment terminates TLS.
    session:
        cookie_httponly: true
        cookie_secure: auto
        cookie_samesite: lax

    # snake_case JSON in and out (CLAUDE.md, technical-scope.md §9.1)
    # applies to every #[MapRequestPayload]/#[MapQueryString] DTO: a PHP
    # property `legalName` maps to and from the JSON key `legal_name`.
    serializer:
        name_converter: 'serializer.name_converter.camel_case_to_snake_case'

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
