security:
    password_hashers:
        App\Platform\Infrastructure\Security\SecurityUser: 'auto'

    providers:
        platform_users:
            id: App\Platform\Infrastructure\Security\UserProvider

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: platform_users
            stateless: false
            json_login:
                check_path: /api/v1/auth/login
                username_path: email
                password_path: password
                # Without one, a *successful* login falls through to
                # whatever controller matches check_path instead of
                # responding (json_login's documented default: "let the
                # original request continue"). Failure already gets a
                # sensible default JSON response, so only success needs one.
                success_handler: App\Platform\Infrastructure\Security\LoginSuccessHandler
            logout:
                path: /api/v1/auth/logout
            # Login attempts per (identifier, IP) pair, per technical-scope.md
            # §3.2 "Security" / CLAUDE.md task 0.8.
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

    access_control:
        - { path: ^/api/v1/auth/(login|password/reset)$, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/auth/password/reset/confirm$, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/health$, roles: PUBLIC_ACCESS }
        - { path: ^/api/doc, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            App\Platform\Infrastructure\Security\SecurityUser:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
