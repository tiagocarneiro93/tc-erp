services:
  php:
    build:
      context: ./docker/php
      args:
        INSTALL_XDEBUG: "false"
    volumes:
      - ./api:/app
    environment: &php-environment
      SERVER_NAME: ":80"
      APP_ENV: dev
      # Overrides api/.env for the Docker network (service hostnames, not 127.0.0.1).
      # Passwords are the throwaway dev-only values from docker/postgres/init/01-roles.sql.
      DATABASE_URL: "postgresql://app_runtime:app_runtime@postgres:5432/tc_erp?serverVersion=16&charset=utf8"
      DATABASE_MIGRATIONS_URL: "postgresql://app_owner:app_owner@postgres:5432/tc_erp?serverVersion=16&charset=utf8"
      REDIS_URL: "redis://redis:6379"
      MESSENGER_TRANSPORT_DSN: "redis://redis:6379/messages"
      MAILER_DSN: "smtp://mailpit:1025"
      S3_ENDPOINT: "http://minio:9000"
    ports:
      - "8080:80"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  # docs/plans/phase-3.md task 3.2: consumes the Redis `async` transport — the AT
  # outbox wake-ups (CommunicateToAt), and later PDF/seal/email jobs.
  worker:
    build:
      context: ./docker/php
    command: php bin/console messenger:consume async -vv --time-limit=3600 --memory-limit=256M
    restart: unless-stopped
    volumes:
      - ./api:/app
    environment: *php-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # technical-scope.md §5.4/§7.5: the AT outbox safety net, once a minute —
  # re-wakes anything pending/failed that is due, and `sending` rows whose
  # worker died. Only queues work; the `worker` service sends it.
  at-sweeper:
    build:
      context: ./docker/php
    command: sh -c 'while true; do php bin/console app:at:sweep; sleep 60; done'
    restart: unless-stopped
    volumes:
      - ./api:/app
    environment: *php-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tc_erp
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025" # web UI
      - "1025:1025" # SMTP
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8025"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # MinIO publishes its official images on quay.io; the Docker Hub repository `minio/minio`
    # is gone (docker pull answers "pull access denied").
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # console
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  node:
    image: node:22-bookworm
    working_dir: /app
    volumes:
      - ./web:/app
      # orval.config.ts reads the spec via a relative `../api/openapi.json`
      # (from /app, i.e. this container's `/api`) — without this mount,
      # `make openapi`/`pnpm generate-client` fails with an ENOENT on
      # /api/openapi.json since only ./web was ever visible in here.
      - ./api:/api
    environment:
      # The web/vite.config.ts proxy target defaults to localhost:8080, which
      # inside this container is itself, not the php service.
      VITE_API_PROXY_TARGET: "http://php"
    command: >
      sh -c "if [ -f package.json ]; then corepack enable && pnpm install && pnpm dev --host;
      else echo 'node: /web has no app yet (task 0.13)'; sleep infinity; fi"
    ports:
      - "5173:5173"

volumes:
  postgres_data:
  redis_data:
  minio_data:
