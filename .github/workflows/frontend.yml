name: Frontend

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'api/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'api/**'
      - '.github/workflows/frontend.yml'

jobs:
  frontend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tc_erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Lint, typecheck and unit test (no API needed)
        working-directory: web
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm typecheck
          pnpm test

      # The e2e spec exercises the real login -> create company -> switch
      # company flow (docs/PLAN.md task 0.13), so it needs a live API backed
      # by a migrated, seeded database (task 0.12's demo accounts).
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, pdo_pgsql, bcmath, sodium, zip, opcache, redis, gd
          coverage: none

      # Sealed PDFs are archived in object storage (docs/plans/phase-3.md tasks 3.4/3.6/3.7), which
      # the document screen's e-mail action exercises. Same MinIO as backend.yml.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            quay.io/minio/minio:latest server /data
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9000/minio/health/live && exit 0
            sleep 1
          done
          echo "MinIO did not become healthy" >&2
          docker logs minio
          exit 1

      - name: Install API dependencies
        working-directory: api
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Set up database roles
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f docker/postgres/init/01-roles.sql
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d tc_erp -v ON_ERROR_STOP=1 -f docker/postgres/init/02-databases.sql

      - name: Migrate and seed the API database
        working-directory: api
        env:
          APP_ENV: dev
          DATABASE_URL: postgresql://app_runtime:app_runtime@127.0.0.1:5432/tc_erp?serverVersion=17&charset=utf8
          DATABASE_MIGRATIONS_URL: postgresql://app_owner:app_owner@127.0.0.1:5432/tc_erp?serverVersion=17&charset=utf8
          REDIS_URL: redis://127.0.0.1:6379
        run: |
          php bin/console doctrine:migrations:migrate --no-interaction
          php bin/console app:seed --no-interaction

      # APP_ENV=e2e (api/config/services_e2e.yaml): the AT webservices are the
      # scripted fakes, the queue is synchronous and mail goes nowhere — a real
      # HTTP server with real sessions, but never the real AT. The migrate/seed
      # step above stays `dev` (same database, same schema). variables_order
      # makes the built-in server see these environment variables at all.
      - name: Start the API
        working-directory: api
        env:
          APP_ENV: e2e
          APP_DEBUG: '0'
          MAILER_DSN: 'null://null'
          DATABASE_URL: postgresql://app_runtime:app_runtime@127.0.0.1:5432/tc_erp?serverVersion=17&charset=utf8
          DATABASE_MIGRATIONS_URL: postgresql://app_owner:app_owner@127.0.0.1:5432/tc_erp?serverVersion=17&charset=utf8
          REDIS_URL: redis://127.0.0.1:6379
        run: |
          php -d variables_order=EGPCS -S 127.0.0.1:8080 -t public &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8080/api/v1/health && break || sleep 1; done

      - name: Install Playwright browsers
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium

      - name: e2e (Playwright)
        working-directory: web
        env:
          VITE_API_PROXY_TARGET: http://127.0.0.1:8080
        run: pnpm e2e
